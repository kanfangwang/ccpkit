name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Trusted Publishing: GitHub 用这个身份直接向 PyPI 证明"我是这个仓库",
  # 不需要任何 API token / secret。
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the tag builds and runs
        run: |
          python -m py_compile ccpkit.py
          python ccpkit.py --version
          python ccpkit.py presets

      - name: Sync version from the tag (single source of truth)
        run: |
          python - <<'PY'
          import os, pathlib, re
          v = os.environ["GITHUB_REF_NAME"].lstrip("v")
          for path, pat in (("pyproject.toml", r'^version = ".*"$'),
                            ("ccpkit.py", r'^VERSION = ".*"$')):
              p = pathlib.Path(path)
              s = p.read_text(encoding="utf-8")
              new, n = re.subn(pat, f'version = "{v}"' if path.endswith(".toml") else f'VERSION = "{v}"',
                               s, count=1, flags=re.M)
              assert n == 1, f"version line not found in {path}"
              p.write_text(new, encoding="utf-8")
          print("version ->", v)
          PY
          python ccpkit.py --version

      - name: Build sdist + wheel
        run: |
          python -m pip install --quiet --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Create GitHub Release (source + package)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ccpkit.py
            dist/*
          generate_release_notes: true
          body: |
            ## Install

            ```bash
            pipx install ccpkit        # or: pip install ccpkit
            ```

            ## Windows: no Python needed

            Download **`ccpkit.exe`** below and double-click it — that opens the
            visual config manager in your browser. No install, no command line.

            Or use it as a CLI:

            ```powershell
            .\ccpkit.exe list
            .\ccpkit.exe doctor myrelay
            .\ccpkit.exe ui
            ```

            Single-file run (any OS, no install):

            ```bash
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ccpkit.py
            python ccpkit.py --version
            ```

      - name: Upload dist for the pypi job
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    # 单独一个 job 发 PyPI —— 这样即使 PyPI 的 Trusted Publisher 还没配好、
    # 这一步红了,上面的 GitHub Release 和下面的 exe 也照样出得来。
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (Trusted Publishing, no token)
        uses: pypa/gh-action-pypi-publish@release/v1

  windows-exe:
    # 单独一个 Windows runner 来出 exe —— 在 Linux 上交叉编译 Windows 单文件
    # 程序出来的东西不能保证能用,不如直接用 windows-latest。
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync version from the tag (same as the release job)
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, re
          v = os.environ["GITHUB_REF_NAME"].lstrip("v")
          for path, pat in (("pyproject.toml", r'^version = ".*"$'),
                            ("ccpkit.py", r'^VERSION = ".*"$')):
              p = pathlib.Path(path)
              s = p.read_text(encoding="utf-8")
              new, n = re.subn(pat, f'version = "{v}"' if path.endswith(".toml") else f'VERSION = "{v}"',
                               s, count=1, flags=re.M)
              assert n == 1, f"version line not found in {path}"
              p.write_text(new, encoding="utf-8")
          print("version ->", v)
          PY

      - name: Build the single-file exe
        run: |
          python -m pip install --quiet --upgrade pyinstaller
          python -m PyInstaller --onefile --console --name ccpkit --icon assets/ccpkit.ico --distpath dist --workpath build --specpath build --noconfirm ccpkit.py
          .\dist\ccpkit.exe --version

      - name: Attach ccpkit.exe to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ccpkit.exe

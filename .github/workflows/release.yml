name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the tag builds and runs
        run: |
          python -m py_compile ccpkit.py
          python ccpkit.py --version
          python ccpkit.py presets

      - name: Build wheel
        run: |
          python -m pip install --quiet --upgrade build
          python -m build --wheel

      - name: Publish release (single-file CLI + wheel attached)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ccpkit.py
            dist/*.whl
          generate_release_notes: true
          body: |
            Single-file CLI: download `ccpkit.py` below and run `python ccpkit.py --help`.

            ```bash
            # no install needed
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ccpkit.py
            python ccpkit.py --version
            ```

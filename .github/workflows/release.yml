name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Trusted Publishing: GitHub 用这个身份直接向 PyPI 证明"我是这个仓库",
  # 不需要任何 API token / secret。
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the tag builds and runs
        run: |
          python -m py_compile ccpkit.py
          python ccpkit.py --version
          python ccpkit.py presets

      - name: Sync version from the tag (single source of truth)
        run: |
          python - <<'PY'
          import os, pathlib, re
          v = os.environ["GITHUB_REF_NAME"].lstrip("v")
          for path, pat in (("pyproject.toml", r'^version = ".*"$'),
                            ("ccpkit.py", r'^VERSION = ".*"$')):
              p = pathlib.Path(path)
              s = p.read_text(encoding="utf-8")
              new, n = re.subn(pat, f'version = "{v}"' if path.endswith(".toml") else f'VERSION = "{v}"',
                               s, count=1, flags=re.M)
              assert n == 1, f"version line not found in {path}"
              p.write_text(new, encoding="utf-8")
          print("version ->", v)
          PY
          python ccpkit.py --version

      - name: Build sdist + wheel
        run: |
          python -m pip install --quiet --upgrade build
          python -m build

      - name: Check the built artifacts
        run: |
          python -m pip install --quiet --upgrade twine
          python -m twine check dist/*

      - name: Publish to PyPI (Trusted Publishing, no token)
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release (single-file CLI + artifacts)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ccpkit.py
            dist/*
          generate_release_notes: true
          body: |
            **Install**

            ```bash
            pipx install ccpkit        # or: pip install ccpkit
            ```

            Or run the single file with no install at all:

            ```bash
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ccpkit.py
            python ccpkit.py --version
            ```

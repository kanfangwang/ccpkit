[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ccpkit"
version = "0.3.0"
description = "Switch Claude Code / Codex CLI API providers with one command"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["claude-code", "codex", "cli", "api-provider", "switcher", "relay", "gateway"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.optional-dependencies]
dev = []

[project.urls]
Homepage = "https://github.com/kanfangwang/ccpkit"
Issues = "https://github.com/kanfangwang/ccpkit/issues"

[project.scripts]
ccpkit = "ccpkit:main"

[tool.setuptools]
py-modules = ["ccpkit"]
